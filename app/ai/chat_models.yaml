models:
  # Gemini takes the bare id; the "google/..." form is only for the OpenAI-compat endpoint.
  - slug: gemini-2.5-flash-lite
    label: Gemini 2.5 Flash Lite
    provider: google
    gateway: google
    provider_model: gemini-2.5-flash-lite
    source: google/gemini-2.5-flash-lite

  - slug: gemini-3.1-flash-lite
    label: Gemini 3.1 Flash Lite
    provider: google
    gateway: google
    provider_model: gemini-3.1-flash-lite
    source: google/gemini-3.1-flash-lite

  # Bare aliases only: no date suffix, and the "@version" form is Vertex-only.
  - slug: claude-haiku-4.5
    label: Claude Haiku 4.5
    provider: anthropic
    gateway: anthropic
    provider_model: claude-haiku-4-5
    source: anthropic/claude-haiku-4-5
    no_sampling: true

  # Keep the "xai/" publisher prefix: the OpenAI-compatible endpoint expects it.
  - slug: grok-4.1-fast
    label: Grok 4.1 Fast
    provider: xai
    gateway: vertex_maas
    provider_model: xai/grok-4.1-fast-non-reasoning
    source: xai/grok-4-1-fast-non-reasoning

  - slug: grok-4.1-fast-reasoning
    label: Grok 4.1 Fast (Reasoning)
    provider: xai
    gateway: vertex_maas
    provider_model: xai/grok-4.1-fast-reasoning
    source: xai/grok-4-1-fast-reasoning

  - slug: gpt-5.4-nano
    label: GPT-5.4 Nano
    provider: openai
    gateway: openai
    provider_model: gpt-5.4-nano
    source: openai/gpt-5.4-nano

  - slug: gpt-5.4-mini
    label: GPT-5.4 Mini
    provider: openai
    gateway: openai
    provider_model: gpt-5.4-mini
    source: openai/gpt-5.4-mini

  - slug: gpt-4o-mini
    label: GPT-4o Mini
    provider: openai
    gateway: openai
    provider_model: gpt-4o-mini
    source: openai/gpt-4o-mini
