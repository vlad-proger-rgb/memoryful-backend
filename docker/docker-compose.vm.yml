version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: memoryful-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/stateful_partition/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  app:
    image: ${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/memoryful-backend:latest
    container_name: memoryful-app
    restart: unless-stopped
    # Migrate before serving so the schema is current before app startup runs
    # (the lifespan syncs reference data). Single VM => no concurrent-migration race.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"
    env_file:
      - ../.env
    environment:
      MCP_SERVER_URL: http://mcp:3001/mcp   # in-app agent loads tools from the sidecar
    volumes:
      - /home/Vlad/secrets/google/service-account.json:/app/secrets/google/service-account.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MCP server sidecar (streamable-HTTP). Same prebuilt image as app (ships
  # mcp_server/ + fastmcp), just a different command; watchtower keeps it in sync
  # since it shares the :latest tag. Internal-only — no host ports; the in-app
  # agent reaches it over the compose network. A public mcp.* subdomain for
  # external clients would be a separate nginx/TLS change, not this.
  mcp:
    image: ${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/memoryful-backend:latest
    container_name: memoryful-mcp
    restart: unless-stopped
    command: python -m mcp_server.main
    env_file:
      - ../.env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0                       # bind all interfaces so app can reach it
      MCP_PORT: "3001"
      MEMORYFUL_API_BASE_URL: http://app:8080  # prod app serves on 8080; tools call back here
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    # Built and pushed by CI (see .github/workflows/deploy-backend.yml); the VM
    # only pulls it. Building here starved the 1GB VM and slowed the live site.
    image: ${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/memoryful-celery:latest
    container_name: celery-worker
    restart: always
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      GCP_CREDENTIALS_PATH: /app/secrets/google/service-account.json
    volumes:
      - /home/Vlad/secrets/google/service-account.json:/app/secrets/google/service-account.json:ro
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot-renew:
    build:
      context: ..
      dockerfile: docker/Dockerfile.certbot
    container_name: certbot-renew
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/stateful_partition/letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "while true; do
        certbot renew --standalone --pre-hook 'docker stop memoryful-nginx' --post-hook 'docker start memoryful-nginx' --quiet;
        sleep 12h;
      done"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/Vlad/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_CLEANUP: "true"
      DOCKER_CONFIG: /config.json
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
