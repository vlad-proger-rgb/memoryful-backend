server {
    listen 80;
    server_name api.memory-ful.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.memory-ful.com;

    ssl_certificate /etc/letsencrypt/live/api.memory-ful.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.memory-ful.com/privkey.pem;

    location / {
        proxy_pass http://memoryful-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (streamed chat completions): 1.0 upstream can't stream chunked, and
        # buffering would hold the whole reply until the end. The app also sends
        # X-Accel-Buffering: no per streamed response.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
