services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: memoryful-app-local
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    env_file:
      - ../.env.local
      # Optional local overrides (real API keys, LLM_MODE=vertex). Gitignored;
      # absent on a fresh clone. Later file wins, so these override .env.local.
      - path: ../.env.local.secrets
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      celery:
        condition: service_started
      pubsub-emulator:
        condition: service_started
      minio:
        condition: service_started
      ollama:
        condition: service_started

    environment:
      ENVIRONMENT: development
      SEED_DB_ON_EMPTY: ${SEED_DB_ON_EMPTY:-true}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      MCP_SERVER_URL: http://mcp:3001/mcp   # in-app agent loads tools from the sidecar (no trailing slash — avoids a 307)

    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # MCP server as a streamable-HTTP sidecar. The in-app agent connects to it at
  # http://mcp:3001/mcp/ over the compose network; its tools call back into the
  # app's REST API (MEMORYFUL_API_BASE_URL) with the forwarded user bearer.
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: memoryful-mcp-local
    volumes:
      - ..:/app
    ports:
      - "3001:3001"   # host-exposed for curl/list_tools debugging
    environment:
      MEMORYFUL_API_BASE_URL: http://app:8000
      MCP_HOST: 0.0.0.0        # bind all interfaces so the app container can reach it
      MCP_PORT: "3001"
      MCP_TRANSPORT: http
    command: python -m mcp_server.main

  db:
    image: postgres:18
    container_name: memoryful-db-local
    restart: always
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+ stores data in a version-specific subdir, so the volume
      # mounts at the parent (/var/lib/postgresql), not /var/lib/postgresql/data.
      - postgres_data_local:/var/lib/postgresql
      - ../backups:/backups   # prod dumps for manage_backup.py + auto-restore
      # Runs only on a fresh volume (first boot / after `down -v`): restores
      # backups/neondb_backup_latest.dump if present.
      - ./init-restore-db.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 1s
      retries: 5
      # Grace period so a first-boot restore of a large dump isn't marked unhealthy.
      start_period: 90s

  redis:
    image: redis:6.0.7
    container_name: memoryful-redis-local
    restart: always
    volumes:
      - redis_data_local:/data
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 1s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: memoryful-rabbitmq-local
    restart: always
    ports:
      - "5672:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: memoryful-celery-local
    volumes:
      - ..:/app
    env_file:
      - ../.env.local
      # Optional local overrides (real API keys, LLM_MODE=vertex). Gitignored;
      # absent on a fresh clone. Later file wins, so these override .env.local.
      - path: ../.env.local.secrets
        required: false
    depends_on:
      pubsub-emulator:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    environment:
      ENVIRONMENT: development
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
    command: >
      sh -c "
        celery -A app.core.celery_app worker -Q ai_queue --loglevel=info --hostname=celery@ai_worker &
        celery -A app.core.celery_app worker -Q apps_queue --loglevel=info --hostname=celery@apps_worker &
        celery -A app.core.celery_app worker -Q email_queue --loglevel=info --hostname=celery@email_worker &
        celery -A app.core.celery_app worker -Q notifications_queue --loglevel=info --hostname=celery@notifications_worker &
        celery -A app.core.celery_app worker -Q system_queue --loglevel=info --hostname=celery@system_worker &
        wait"

  flower:
    image: mher/flower
    container_name: memoryful-flower-local
    restart: on-failure
    command: celery --broker=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}// flower
    ports:
      - "5555:5555"
    depends_on:
      - celery
      - rabbitmq

  pubsub-emulator:
    image: google/cloud-sdk:latest
    container_name: memoryful-pubsub-local
    ports:
      - "8085:8085"
    command: >
      sh -c "
        gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
      "
    environment:
      - PUBSUB_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}

  minio:
    image: minio/minio:latest
    container_name: memoryful-minio-local
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data_local:/data

  # One-shot: create the bucket and seed default workspace assets into MinIO.
  # Idempotent (safe to run every `up`); mirrors only new/changed files.
  # Real user photos are NOT seeded — they live in prod GCS and would be huge.
  minio-init:
    image: minio/mc
    container_name: memoryful-minio-init
    depends_on:
      - minio
    volumes:
      - ../bucket_base:/bucket_base:ro
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 '${S3_ACCESS_KEY_ID:-minioadmin}' '${S3_SECRET_ACCESS_KEY:-minioadmin}'; do
          echo 'waiting for minio...'; sleep 1;
        done;
        mc mb --ignore-existing local/${S3_BUCKET:-memoryful};
        mc anonymous set download local/${S3_BUCKET:-memoryful};
        mc mirror --overwrite /bucket_base local/${S3_BUCKET:-memoryful};
        echo 'minio seed complete';
      "

  ollama:
    image: ollama/ollama:latest
    container_name: memoryful-ollama-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_local:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data_local:
  postgres_data_local:
  minio_data_local:
  ollama_data_local:
