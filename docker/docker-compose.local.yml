services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: memoryful-app-local
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    env_file:
      - ../.env.local
      # Optional local overrides (real API keys, LLM_MODE=vertex). Gitignored;
      # absent on a fresh clone. Later file wins, so these override .env.local.
      - path: ../.env.local.secrets
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
      pubsub-emulator:
        condition: service_started
      seaweedfs:
        condition: service_started
      ollama:
        condition: service_started

    environment:
      ENVIRONMENT: development
      SEED_DB_ON_EMPTY: ${SEED_DB_ON_EMPTY:-true}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      MCP_SERVER_URL: http://mcp:3001/mcp   # in-app agent loads tools from the sidecar (no trailing slash — avoids a 307)
      WATCHFILES_FORCE_POLLING: "true"   # the Docker Desktop bind mount delivers no inotify events

    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
      "

  # MCP server as a streamable-HTTP sidecar. The in-app agent connects to it at
  # http://mcp:3001/mcp/ over the compose network; its tools call back into the
  # app's REST API (MEMORYFUL_API_BASE_URL) with the forwarded user bearer.
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: memoryful-mcp-local
    restart: always
    volumes:
      - ..:/app
    ports:
      - "3001:3001"   # host-exposed for curl/list_tools debugging
    environment:
      MEMORYFUL_API_BASE_URL: http://app:8000
      MCP_HOST: 0.0.0.0        # bind all interfaces so the app container can reach it
      MCP_PORT: "3001"
      MCP_TRANSPORT: http
    command: python -m mcp_server.main

  db:
    image: postgres:18
    container_name: memoryful-db-local
    restart: always
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+ stores data in a version-specific subdir, so the volume
      # mounts at the parent (/var/lib/postgresql), not /var/lib/postgresql/data.
      - postgres_data_local:/var/lib/postgresql
      - ../backups:/backups   # prod dumps for manage_backup.py + auto-restore
      # Runs only on a fresh volume (first boot / after `down -v`): restores
      # backups/neondb_backup_latest.dump if present.
      - ./init-restore-db.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    healthcheck:
      # Over TCP: the first-boot restore runs on a socket-only server that must not count as up.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 1s
      retries: 5
      # Grace period so a first-boot restore of a large dump isn't marked unhealthy.
      start_period: 90s

  redis:
    image: redis:6.0.7
    container_name: memoryful-redis-local
    restart: always
    volumes:
      - redis_data_local:/data
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 1s
      retries: 5

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: memoryful-celery-local
    volumes:
      - ..:/app
    env_file:
      - ../.env.local
      # Optional local overrides (real API keys, LLM_MODE=vertex). Gitignored;
      # absent on a fresh clone. Later file wins, so these override .env.local.
      - path: ../.env.local.secrets
        required: false
    depends_on:
      pubsub-emulator:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    environment:
      ENVIRONMENT: development
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      WATCHFILES_FORCE_POLLING: "true"   # the Docker Desktop bind mount delivers no inotify events
    command: watchfiles --filter python --sigint-timeout 20 "sh docker/celery-workers-local.sh" app

  pubsub-emulator:
    image: google/cloud-sdk:latest
    container_name: memoryful-pubsub-local
    restart: always
    ports:
      - "8085:8085"
    command: >
      sh -c "
        gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
      "
    environment:
      - PUBSUB_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: memoryful-seaweedfs-local
    restart: always
    # s3.json holds the credentials and the bucket's anonymous read access.
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:9000"
      - "8888:8888"
    volumes:
      - seaweedfs_data_local:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot: create the bucket and seed default workspace assets into SeaweedFS.
  # Idempotent (safe to run every `up`); syncs only new/changed files.
  # Real user photos are NOT seeded — they live in prod GCS and would be huge.
  seaweedfs-init:
    image: amazon/aws-cli:2.37.9
    container_name: memoryful-seaweedfs-init
    depends_on:
      - seaweedfs
    volumes:
      - ../bucket_base:/bucket_base:ro
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://seaweedfs:9000
    entrypoint: >
      /bin/sh -c "
        until aws s3 ls > /dev/null 2>&1; do
          echo 'waiting for seaweedfs...'; sleep 1;
        done;
        aws s3api head-bucket --bucket ${S3_BUCKET:-memoryful} 2> /dev/null || aws s3 mb s3://${S3_BUCKET:-memoryful};
        aws s3 sync /bucket_base s3://${S3_BUCKET:-memoryful} --only-show-errors;
        echo 'seaweedfs seed complete';
      "

  ollama:
    image: ollama/ollama:latest
    container_name: memoryful-ollama-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_local:/root/.ollama

volumes:
  redis_data_local:
  postgres_data_local:
  seaweedfs_data_local:
  ollama_data_local:
