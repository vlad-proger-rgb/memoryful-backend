[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "RUF", "C4", "PERF", "ASYNC", "TRY", "PTH", "S"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"mcp_server/tests/*" = ["S101"]
"app/init_db.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_server"]
known-third-party = ["alembic"]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

