[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "RUF", "C4", "PERF", "ASYNC", "TRY", "PTH", "S"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"mcp_server/tests/*" = ["S101", "S105", "S106"]
"app/tests/*" = ["S101", "S105", "S106"]
"app/init_db.py" = ["S311", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_server"]
known-third-party = ["alembic"]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]


[tool.pytest.ini_options]
# No testpaths: the two suites need different containers. app/tests needs the DB
# and the full env; mcp_server/tests mocks the API at the httpx layer.
asyncio_mode = "auto"
# One loop for the whole run. `engine` is module-level, so its pooled asyncpg
# connections outlive a per-test loop and fail teardown against a closed one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
